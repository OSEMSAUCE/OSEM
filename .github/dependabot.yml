# Grouped monthly dependency PRs.
#
# WHY THIS EXISTS: GitHub security alerts arrive as email, one per advisory,
# with no sense of whether the package ships to users or is a linter on the
# build machine. Dependabot turns them into a small number of reviewable PRs
# instead — and an alert with an open PR against it stops nagging.
#
# Majors are deliberately IGNORED. Get Cache is a shipping App Store app; a
# breaking vite/vitest bump costs more than the dev-only DoS it fixes. Take
# majors by hand via the /security-sweep skill, which reports them for a
# human decision.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
