   width="527.0625"
   height="187.97406"
   viewBox="0 0 139.5 49.734803"
   version="1.1"
   id="search-page-orgs-selected-svg"
   xml:space="preserve"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"><defs
     id="search-page-orgs-selected-defs"><rect
       x="1892.6471"
       y="2832.3528"
       width="840"
       height="338.23529"
       id="search-page-orgs-selected-rect31" /></defs><g
     id="search-page-orgs-selected-layer12"
     style="display:inline"
     transform="translate(-496.14656,-693.19142)"><path
       style="display:inline;opacity:1;fill:#000000;fill-opacity:1;stroke:#4c4c4c;stroke-width:2.6564;stroke-dasharray:none;stroke-opacity:1"
       d="m 501.07947,741.19915 -3.50135,-46.67953 h 132.72612 l -0.38904,47.07181 z"
       id="search-page-orgs-selected-path22" /><text
       xml:space="preserve"
       transform="matrix(0.17127672,0,0,0.17127672,186.16798,221.8615)"
       id="search-page-orgs-selected-text30"
       style="font-style:normal;font-variant:normal;font-weight:500;font-stretch:normal;font-size:96px;font-family:Futura;-inkscape-font-specification:'Futura Medium';writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#search-page-orgs-selected-rect31);display:inline;opacity:1;fill:#ffd600;fill-opacity:1;stroke:#4c4c4c;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-opacity:1;paint-order:normal"><tspan
