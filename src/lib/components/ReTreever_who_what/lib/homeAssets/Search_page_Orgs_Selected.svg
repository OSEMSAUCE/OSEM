<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Selected-state sticker for the "Organizations" tab. Built from
     Search_page_Projects_Selected.svg so the two selected tabs are the same
     artwork: same black tilted box, same #4c4c4c stroke, same gold (#ffd600)
     Futura Medium at the same 0.17127672 scale. Only the word and the box's
     width differ, because "Organizations" is a longer word than "Projects".

     The box width is set by the WORD, not chosen by eye: the text sits at a
     fixed origin, so widening the box only adds room on the right. Projects
     renders with ~25px left / ~23px right of slack, and this box is sized to
     land in that same range — an earlier, tighter box left 2px on the right
     and the word read as slammed into the edge. Re-measure (not re-guess) if
     the word or the font ever changes. -->
