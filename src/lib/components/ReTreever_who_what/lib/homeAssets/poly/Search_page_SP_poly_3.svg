	<g transform="translate(-712.22143,-573.94652)">
		<!-- Tree-planting canopy (2024-09-03 hero original, 4000px source).
		     Its own file, NOT sp-poly-3.webp — shards 7 and 10 still draw that
		     one, so overwriting it would have silently changed three shards.

		     The image box is the CLIP'S OWN bounding box plus 3%, not the big
		     714x476 box the other shards inherited. Those place a whole photo
		     and let the clip throw ~94% of it away, so the file has to be huge
		     for the visible sliver to be sharp. Sizing the box to what is
		     actually seen means every pixel shipped is a pixel rendered. -->
		<image width="154.44419" height="139.84499" x="713.99079" y="573.77613" preserveAspectRatio="xMidYMid slice" clip-path="url(#search_shard-3-clip)" href="/pub-Rtvr/home/poly/sp-poly-planting.webp" />
